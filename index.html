<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zomm Brasil — Solicitar Corrida</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --azul:       #1a237e;
    --azul-escuro:#0d1554;
    --vermelho:   #e53935;
    --branco:     #ffffff;
    --cinza-bg:   #f4f5f9;
    --cinza-borda:#dde1ee;
    --cinza-texto:#5a6282;
    --verde:      #2e7d32;
    --sombra:     0 4px 24px rgba(26,35,126,0.10);
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: 'DM Sans', sans-serif; background-color: var(--cinza-bg); color: var(--azul-escuro); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  
  .container { width: 100%; max-width: 500px; }
  .screen { display: none; background: var(--branco); padding: 40px; border-radius: 24px; box-shadow: var(--sombra); border: 1px solid var(--cinza-borda); }
  .screen.active { display: block; animation: fadeIn 0.3s ease-out; }
  
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  h1 { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 26px; margin-bottom: 20px; color: var(--azul); text-align: center; }
  
  .form-group { margin-bottom: 12px; text-align: left; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: var(--azul-escuro); text-transform: uppercase; }
  input { width: 100%; padding: 12px 15px; border: 1px solid var(--cinza-borda); border-radius: 10px; font-family: inherit; font-size: 15px; outline: none; }
  input:focus { border-color: var(--azul); }

  .btn { display: block; width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.2s; font-family: 'Syne', sans-serif; margin-top: 10px; }
  .btn-primary { background-color: var(--azul); color: var(--branco); }
  .btn-primary:disabled { background-color: #ccc; cursor: not-allowed; }
  .btn-outline { background: transparent; border: 2px solid var(--cinza-borda); color: var(--cinza-texto); margin-top: 20px; }

  .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--azul); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  
  .result-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--cinza-borda); }
  .result-label { color: var(--cinza-texto); }
  .result-value { font-weight: 600; }
</style>
</head>
<body>

<div class="container">
  <div id="tela-inicial" class="screen active">
    <h1>Solicitar Corrida</h1>
    
    <div class="form-group">
      <label>Nome do Passageiro</label>
      <input type="text" id="pass-nome" placeholder="Nome completo">
    </div>

    <div class="form-group">
      <label>Telefone / WhatsApp</label>
      <input type="tel" id="pass-fone" placeholder="(00) 00000-0000">
    </div>

    <div class="form-group">
      <label>Rua de Destino</label>
      <input type="text" id="destino-rua" placeholder="Ex: Av. Brasil, 123">
    </div>

    <div class="form-group">
      <label>Bairro</label>
      <input type="text" id="destino-bairro" placeholder="Bairro">
    </div>

    <div class="form-group">
      <label>Cidade</label>
      <input type="text" id="destino-cidade" value="Guararema">
    </div>

    <button class="btn btn-primary" id="btn-solicitar" onclick="enviarSolicitacao()">SOLICITAR AGORA</button>
  </div>

  <div id="tela-aguardando" class="screen">
    <div class="loader"></div>
    <h1>Buscando Motorista...</h1>
    <p style="text-align:center; color: var(--cinza-texto);">Estamos enviando seu pedido aos motoristas próximos. Por favor, aguarde.</p>
    <button class="btn btn-outline" onclick="location.reload()">CANCELAR PEDIDO</button>
  </div>

  <div id="tela-resultado" class="screen">
    <h1 style="color: var(--verde)">Motorista Aceitou!</h1>
    <div class="result-row"><span class="result-label">Motorista:</span><span class="result-value" id="res-motorista"></span></div>
    <div class="result-row"><span class="result-label">Veículo:</span><span class="result-value" id="res-veiculo"></span></div>
    <div class="result-row"><span class="result-label">Placa:</span><span class="result-value" id="res-placa"></span></div>
    <button class="btn btn-primary" style="margin-top:20px" onclick="location.reload()">NOVA CORRIDA</button>
  </div>
</div>

<script>
  const CONFIG = {
    N8N_WEBHOOK_URL: 'https://fatbarracuda-n8n.cloudfy.live/webhook/zomm-solicitar',
    N8N_STATUS_URL:  'https://fatbarracuda-n8n.cloudfy.live/webhook/zomm-status'
  };

  let sessionId = null;
  let pollingTimer = null;

  async function enviarSolicitacao() {
    const btn = document.getElementById('btn-solicitar');
    
    // Pegar os valores exatamente como estão no seu formulário
    const dadosParaEnviar = {
        session_id: 'SESS_' + Date.now(),
        passageiro: {
            nome: document.getElementById('pass-nome').value,
            telefone: document.getElementById('pass-fone').value
        },
        destino: {
            rua: document.getElementById('destino-rua').value,
            bairro: document.getElementById('destino-bairro').value,
            cidade: document.getElementById('destino-cidade').value
        }
    };

    console.log("Tentando enviar:", dadosParaEnviar);

    try {
        const response = await fetch('https://fatbarracuda-n8n.cloudfy.live/webhook/zomm-solicitar', {
            method: 'POST',
            // ESTA PARTE É CRUCIAL PARA O N8N NÃO RECEBER VAZIO:
            headers: {
                'Accept': 'application/json',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(dadosParaEnviar)
        });

        if (response.ok) {
            console.log("O n8n recebeu!");
            mostrarTela('tela-aguardando');
        } else {
            console.error("O n8n respondeu com erro:", response.status);
        }
    } catch (error) {
        console.error("Erro na tentativa de envio:", error);
    }
}

  function iniciarPolling() {
    pollingTimer = setInterval(async () => {
      try {
        const res = await fetch(`${CONFIG.N8N_STATUS_URL}?session_id=${sessionId}&t=${Date.now()}`);
        const data = await res.json();
        
        if (data.status === 'aceito' || data.status === 'em_curso') {
          clearInterval(pollingTimer);
          document.getElementById('res-motorista').textContent = data.dados.nome_condutor || 'Confirmado';
          document.getElementById('res-veiculo').textContent = data.dados.veiculo || '—';
          document.getElementById('res-placa').textContent = data.dados.placa_veiculo || '—';
          mostrarTela('tela-resultado');
        }
      } catch (e) { console.warn("Erro ao checar status..."); }
    }, 5000);
  }

  function mostrarTela(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }
</script>
</body>
</html>
